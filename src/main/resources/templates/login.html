<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; TaskFlow Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
      background: #ffffff;
      padding: 32px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.4rem;
    }
    .nav-pills .nav-link {
      border-radius: 10px;
      font-weight: 600;
      color: #64748b;
    }
    .nav-pills .nav-link.active {
      background-color: #6366f1;
      color: #ffffff;
    }
    .form-control {
      border-radius: 10px;
      padding: 10px 14px;
    }
    .btn-auth {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px;
      border: none;
    }
    .btn-auth:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon shadow-sm mb-2">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <h4 class="fw-bold text-dark mb-0">TaskFlow Pro</h4>
      <p class="text-secondary small">Smart Deadlines & Personal Agenda</p>
    </div>

    <!-- Tab switcher -->
    <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-3" id="authTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin" type="button">Sign In</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup" type="button">Sign Up</button>
      </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
      <!-- Sign In Form -->
      <div class="tab-pane fade show active" id="signin" role="tabpanel">
        <form action="/auth/login" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-auth w-100">Sign In to Dashboard</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div class="tab-pane fade" id="signup" role="tabpanel">
        <form action="/auth/register" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Your Name" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Email Address (for Deadline Alerts)</label>
            <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Create Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-auth w-100">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
